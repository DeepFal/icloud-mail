services:
  icloud-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        DOCKER_HUB_MIRROR: ${DOCKER_HUB_MIRROR:-docker.m.daocloud.io}
        GOPROXY: ${GOPROXY:-https://goproxy.cn}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-mirrors.aliyun.com}
    image: ghcr.io/deepfal/icloud-mail:${ICLOUD_MAIL_VERSION:-v0.2.10}
    pull_policy: build

  postgres:
    build:
      context: .
      dockerfile: Dockerfile
      target: postgres-runtime
      args:
        DOCKER_HUB_MIRROR: ${DOCKER_HUB_MIRROR:-docker.m.daocloud.io}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-mirrors.aliyun.com}
    image: ghcr.io/deepfal/icloud-mail-postgres:${ICLOUD_MAIL_VERSION:-v0.2.10}
    pull_policy: build
